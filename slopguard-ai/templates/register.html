{% extends 'base.html' %}{% block title %}Create account — SlopGuard AI{% endblock %}{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="eyebrow">GET STARTED</div><h1>Create account</h1><p class="muted">Your scans stay attached to your account.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input class="form-control" name="username" required minlength="3" maxlength="40" autocomplete="username"></label><label>Email<input class="form-control" name="email" type="email" required autocomplete="email"></label><label>Password <small>(10 characters minimum)</small><input class="form-control" name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><button class="btn btn-accent w-100 mt-3">Create account</button></form><p class="muted mt-4 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div></div>{% endblock %}

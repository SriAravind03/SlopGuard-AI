{% extends 'base.html' %}{% block title %}Settings — SlopGuard AI{% endblock %}{% block content %}<div class="container page-wrap"><div class="page-heading"><div><div class="eyebrow">ACCOUNT</div><h1>Settings</h1><p class="muted">Manage your sign-in credentials.</p></div></div><section class="panel" style="max-width:620px"><span class="mono-label">PASSWORD</span><h2>Change password</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input class="form-control" name="current_password" type="password" required autocomplete="current-password"></label><label class="mt-3">New password<input class="form-control" name="new_password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><label class="mt-3">Confirm new password<input class="form-control" name="confirm_password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><button class="btn btn-accent mt-4">Update password</button></form></section></div>{% endblock %}
